# Feature knowledge record (OKF).
# Curated fields describe business meaning; the `derived` block is
# regenerated by `python3 -m fl derive --write` and must not be edited.
---
schema: feature-knowledge-record/0.1
id: deposit.interest.interest_accrual
module: feature_library.deposit.interest.interest_accrual
version: 1.0.0
domain: deposit
status: supported
capability: "Accrues interest daily on a deposit account's balance, delegating the rate calculation to any injected interest type so that flat, tiered and overdraft interest all share one accrual engine."
client_functionality: "The customer sees interest building up on their account every day rather than only when it is paid. Accrued amounts are held on separate ACCRUED_INTEREST_PAYABLE / ACCRUED_INTEREST_RECEIVABLE addresses, so a statement can show 'interest earned so far this month' before the application date, and closing the account mid-period still settles the interest actually earned. Because the rate is supplied by an injected interest type, the same customer experience is produced whether the bank offers a single rate, balance tiers, or a different rate on overdrawn balances."
when_to_use: "the product pays or charges interest that must be earned daily and applied periodically, and you want the rate policy to remain a separate, independently tested feature."
when_not_to_use: "interest is charged as a fixed fee, or the product needs interest computed on a statement cycle rather than daily \u2014 use the lending credit card accrual feature for revolving balances."
hooks:
  - activation_hook
  - scheduled_event_hook
parameters:
  - parameter_id: "&{interest_accrual_time}"
    display_name: Interest Accrual Time
    description: "The time of day, as HH:mm:ss, at which the daily accrual runs."
    level: template
    shape: string_constraint
    example: "00:00:00"
    resource: feature_library/src/feature_library/deposit/interest/parameter_resource_defs/interest_accrual_time.resource.yaml
    drives: The moment the INTEREST_ACCRUAL schedule fires each day.
  - parameter_id: "&{accrual_precision}"
    display_name: Accrual Precision
    description: Number of decimal places accrued interest is rounded to.
    level: template
    shape: decimal_constraint
    example: "5"
    resource: feature_library/src/feature_library/deposit/interest/parameter_resource_defs/accrual_precision.resource.yaml
    drives: "Rounding of every daily accrual amount, and therefore the total interest earned."
  - parameter_id: "&{days_in_year_option}"
    display_name: Days In Year Option
    description: "Day-count convention: 360, 365, 366 or actual."
    level: template
    shape: enumeration_constraint
    example: "365"
    resource: feature_library/src/feature_library/deposit/interest/parameter_resource_defs/days_in_year_option.resource.yaml
    drives: Conversion of the annual rate into the daily rate.
  - parameter_id: "&{accrued_interest_payable_account}"
    display_name: Accrued Interest Payable Account
    description: Internal account funding interest owed to customers.
    level: template
    shape: account_constraint
    example: ACCRUED_INTEREST_PAYABLE
    resource: feature_library/src/feature_library/deposit/interest/parameter_resource_defs/accrued_interest_payable_account.resource.yaml
    drives: The GL account credited when the bank owes the customer interest.
  - parameter_id: "&{accrued_interest_receivable_account}"
    display_name: Accrued Interest Receivable Account
    description: Internal account receiving interest owed by customers.
    level: template
    shape: account_constraint
    example: ACCRUED_INTEREST_RECEIVABLE
    resource: feature_library/src/feature_library/deposit/interest/parameter_resource_defs/accrued_interest_receivable_account.resource.yaml
    drives: The GL account debited when the customer owes the bank interest.
  - parameter_id: "&{denomination}"
    display_name: Denomination
    description: The currency the account operates in.
    level: template
    shape: string_constraint
    example: GBP
    resource: feature_library/src/feature_library/common/parameter_resource_defs/denomination.resource.yaml
    drives: "The denomination of every accrual posting; balances in other denominations are ignored."
requirements:
  - id: REQ-DEP-INT-001
    statement: "Interest must accrue daily on the customer's cleared balance at the rate applicable to that balance."
    source: Deposit product baseline requirements
    satisfied_by:
      - schedule_logic
      - "&{fixed_interest_rate}"
    verified_by:
      - tests/deposit/interest/interest_accrual/unit/test_interest_accrual.py
      - tests/deposit/interest/interest_accrual/simulation/test_interest_accrual.py
  - id: REQ-DEP-INT-002
    statement: The bank must be able to configure the day-count convention used to convert an annual rate to a daily rate.
    source: Deposit product baseline requirements
    satisfied_by:
      - "&{days_in_year_option}"
    verified_by:
      - tests/deposit/interest/interest_accrual/unit/test_interest_accrual.py
  - id: REQ-DEP-INT-003
    statement: Accrued interest must post to the correct internal account depending on whether it is payable to or receivable from the customer.
    source: Finance / GL control requirements
    satisfied_by:
      - "&{accrued_interest_payable_account}"
      - "&{accrued_interest_receivable_account}"
    verified_by:
      - tests/deposit/interest/interest_accrual/unit/test_interest_accrual.py
products: []
simulation_notes: "Compose this feature with an interest type (for example `deposit.interest.secondary.flat_interest`) into a contract that implements `activation_hook` and `scheduled_event_hook`, then assert on the ACCRUED_INTEREST_PAYABLE dimension after advancing the simulation past `interest_accrual_time`. Use `ExpectedSchedule` to assert the INTEREST_ACCRUAL event fires at the configured time, and parameterise the test over timezones to prove processing-group behaviour."
determinism_notes: "The accrual amount depends only on the effective balance, the injected rate, the `days_in_year_option` convention and `accrual_precision` \u2014 never on wall-clock time. The schedule anchors on `interest_accrual_time`, so re-running the same effective datetime produces byte-identical instructions. Zero-value accruals return no instructions at all, which keeps replay idempotent and avoids polluting the ledger."
owner: deposit-domain
tags:
  - interest
  - accrual
  - schedule
  - deposit
