rules:
  - id: avoid-datetime-now
    patterns:
      - pattern-either:
          - pattern: datetime.now(...)
          - pattern: datetime.utcnow(...)
    paths:
      exclude:
        - "**/test_*.py"
    message: "Do not use datetime.now() or utcnow(). Use Vault's effective_datetime to ensure reproducibility and simulator accuracy."
    languages: [python]
    severity: ERROR

  - id: avoid-empty-hooks
    languages: [python]
    severity: ERROR
    message: "PERFORMANCE: Empty hooks incur unnecessary Vault execution costs. Please remove."
    patterns:
      - pattern: |
          def $HOOK(vault, ...):
              ...
              pass
      - metavariable-regex:
          metavariable: $HOOK
          regex: '^(pre_|post_|derived_).*_hook$'

  - id: avoid-inplace-mutation-contract-api
    patterns:
      - pattern: $OBJ.$ATTR += $VAL
      - metavariable-regex:
          metavariable: $OBJ
          regex: '.*(instruction|posting|parameter).*'
    message: "Avoid mutating Contract API objects in-place. Instantiate a new object instead to ensure class-level validation is triggered."
    languages: [python]
    severity: WARNING

  - id: forbid-inplace-mutation
    languages: [python]
    severity: WARNING
    message: "VALIDATION: Modifying objects in-place bypasses Contract API validation. Instantiate a new object instead."
    patterns:
      - pattern: $OBJ.$ATTR += $VAL
      - metavariable-regex:
          metavariable: $OBJ
          regex: '(?i)(instruction|posting|parameter|balance)'

  - id: strict-boolean-comparison
    patterns:
      - pattern-either:
          - pattern: $X == True
          - pattern: $X == False
    message: "Use 'if $X:' or 'if not $X:' for boolean evaluations. If distinguishing from None, use 'if $X is False:'."
    languages: [python]
    severity: INFO

  - id: enforce-import-as-syntax-for-features
    patterns:
      - pattern-regex: ^\s*from\s+library\.features
    message: "Imports from 'features' must use 'import features.module as alias' syntax to be compatible with the Smart Contract Renderer."
    languages: [python]
    severity: ERROR
    paths:
      include:
        - "/library/**/*.py"
      exclude:
        - "*test*"
        - "*_test.py"
        - "test_*.py"

  - id: bof-naming-convention
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $VAR = BalancesObservationFetcher(...)
              - metavariable-regex:
                  metavariable: $VAR
                  regex: '^(?!.*(_BOF|_bof)$)'
          - patterns:
              - pattern: BalancesObservationFetcher(..., fetcher_id=$ID, ...)
              - metavariable-regex:
                  metavariable: $ID
                  regex: '^".*(?<!_BOF)(?<!_bof)"$|^''.*(?<!_BOF)(?<!_bof)''$'
    message: "BalancesObservationFetcher identifiers and fetcher_ids must end with '_BOF' or '_bof'."
    languages: [python]
    severity: ERROR

